{% extends "base.html" %}
{% block title %}状態 — autoforge{% endblock %}

{% block head %}
<style>
/* ─── STATUS STRIP ─── */
#status-strip {
  display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
  padding: .6rem .9rem;
  border-radius: 8px; margin-bottom: 1.4rem;
  border: 1px solid var(--border);
  font-size: .78rem;
}
#status-strip.ss-ok   { border-color: #4ade8033; background: #0a1a0f; }
#status-strip.ss-warn { border-color: #facc1533; background: #141106; }
#status-strip.ss-err  { border-color: #f8717133; background: #140909; }
.ss-label { font-weight: 800; font-size: .82rem; display: flex; align-items: center; gap: .38rem; }
.ss-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.ss-dot-ok   { background: var(--green); box-shadow: 0 0 6px var(--green); }
.ss-dot-warn { background: var(--yellow); }
.ss-dot-err  { background: var(--red); }
@keyframes blink { 50% { opacity: .3; } }
.ss-dot-pulse { animation: blink .9s infinite; }
.ss-chip { background: #181818; border: 1px solid var(--border); border-radius: 999px; padding: .15rem .6rem; font-size: .75rem; color: var(--muted); }
.ss-ts { margin-left: auto; color: var(--dim); font-size: .75rem; }

/* ─── ALERT BOX ─── */
#alert-box { border-radius: 8px; padding: .8rem 1rem; margin-bottom: 1.2rem; border: 1px solid; }
#alert-box.ab-err  { border-color: #f8717155; background: #120606; }
#alert-box.ab-warn { border-color: #facc1544; background: #110f03; }
.ab-title { font-size: .78rem; font-weight: 700; display: flex; gap: .4rem; align-items: center; margin-bottom: .5rem; }
.ab-row { display: flex; gap: .6rem; align-items: baseline; padding: .3rem 0; border-bottom: 1px solid #1c1c1c; font-size: .8rem; }
.ab-row:last-child { border-bottom: none; padding-bottom: 0; }
.ab-badge { flex-shrink: 0; font-size: .72rem; font-weight: 700; letter-spacing: .05em; padding: .08rem .38rem; border-radius: 3px; }
.ab-badge-err  { background: #f8717122; color: var(--red); }
.ab-badge-warn { background: #facc1520; color: var(--yellow); }
.ab-ttl { font-weight: 600; }
.ab-dtl { color: var(--dim); font-size: .78rem; }

/* ─── RESULTS ─── */
#results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 1px; }
@media (max-width: 767px) { #results-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) { #results-grid { grid-template-columns: 1fr; } }
.rc-cell { background: var(--surface); padding: 1rem .9rem; text-align: center; }
.rc-cell.rc-active { background: #0a1220; }
.rc-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.rc-big { font-family: var(--font-mono); font-size: 2.4rem; font-weight: 900; line-height: 1.1; letter-spacing: -.04em; color: var(--dim); margin: .3rem 0; }
.rc-cell.rc-active .rc-big { color: var(--blue); }
.rc-sub { font-size: .7rem; color: var(--dim); font-family: var(--font-mono); }
.rc-sub b { color: var(--muted); font-weight: 700; }

/* ─── MID GRID ─── */
#mid-grid { display: grid; grid-template-columns: 1fr 260px; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 1px; margin-bottom: 1.4rem; }
@media (max-width: 780px) { #mid-grid { grid-template-columns: 1fr; } }

/* ─── NORTH STAR ─── */
#ns-block { background: var(--surface); padding: 1.2rem 1.3rem; }
#ns-block .ns-head { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: .7rem; }
#ns-block .ns-row { display: flex; align-items: baseline; gap: .7rem; margin-bottom: .4rem; flex-wrap: wrap; }
.ns-num { font-family: var(--font-mono); font-size: 2.6rem; font-weight: 900; color: var(--blue); line-height: 1; }
.ns-tgt { font-size: .78rem; color: var(--dim); }
.ns-trend { font-size: .75rem; font-weight: 700; padding: .1rem .4rem; border-radius: 4px; }
.ns-trend-up   { background: #0c2016; color: var(--green); }
.ns-trend-down { background: #1c0909; color: var(--red); }
.ns-trend-flat { background: #1a1a1a; color: var(--muted); }
.ns-prog-outer { height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: .2rem; }
.ns-prog-inner { height: 100%; background: linear-gradient(90deg, var(--blue), var(--lime)); border-radius: 999px; }
.ns-prog-labels { display: flex; justify-content: space-between; font-size: .7rem; color: var(--dim); }
.ns-spark svg polyline { fill: none; stroke: #60a5fa33; stroke-width: 1.5; stroke-linejoin: round; }
.ns-subs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); margin-top: .8rem; border-top: 1px solid var(--border); }
.ns-sub-cell { background: var(--surface); padding: .55rem; text-align: center; }
.ns-sub-cell .sn { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ns-sub-cell .sv { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; }

/* ─── RIGHT STACK ─── */
#right-stack { display: grid; grid-template-rows: auto auto; }
.rs-cell { background: var(--surface); padding: 1.1rem; border-bottom: 1px solid var(--border); }
.rs-cell:last-child { border-bottom: none; }
.rs-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: .5rem; }
.rs-next-t { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 800; line-height: 1; margin-bottom: .15rem; }
.rs-next-w { font-size: .82rem; color: var(--muted); }
.rs-next-m { font-size: .75rem; color: var(--dim); margin-top: .25rem; }
.rs-goal-days { font-family: var(--font-mono); font-size: 2.4rem; font-weight: 900; line-height: 1; }
.rs-goal-desc { font-size: .78rem; color: var(--dim); margin: .2rem 0 .5rem; }
.rs-goal-bar { height: 3px; background: var(--border); border-radius: 999px; overflow: hidden; }
.rs-goal-fill { height: 100%; background: var(--dim); border-radius: 999px; }
.rs-goal-pct { font-size: .72rem; color: var(--dim); margin-top: .2rem; }

/* ─── TIMELINE ─── */
#tl-wrap { margin-bottom: 1.4rem; }
#tl-wrap .section-hd { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; padding-bottom: .4rem; margin-bottom: .6rem; border-bottom: 1px solid var(--line); }
.tl-row { display: grid; grid-template-columns: 50px 22px 1fr; gap: 0 .45rem; padding: .4rem 0; border-bottom: 1px solid var(--line); align-items: center; }
.tl-row:last-child { border-bottom: none; }
.tl-t { font-family: var(--font-mono); font-size: .78rem; color: var(--dim); }
.tl-ico { text-align: center; font-size: .85rem; }
.tl-bd { font-size: .85rem; }
.tl-done .tl-t  { color: var(--dim); text-decoration: line-through; }
.tl-done .tl-bd { color: var(--muted); }
.tl-now  .tl-t  { color: var(--blue); font-weight: 700; }
.tl-now  .tl-bd { color: var(--blue); font-weight: 600; }
.tl-slots { display: flex; flex-wrap: wrap; gap: .15rem; margin-top: .18rem; }
.tl-slot { font-family: var(--font-mono); font-size: .72rem; padding: .02rem .3rem; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
.tl-slot-done { color: var(--dim); text-decoration: line-through; }
.tl-slot-next { color: var(--text); }
.tl-slot-now  { color: var(--blue); border-color: #60a5fa44; background: #0a1520; }

/* ─── FOLD ─── */
#fold-wrap { border-top: 1px solid var(--line); }
.fold-item { border-bottom: 1px solid var(--line); }
.fold-item:last-child { border-bottom: none; }
.fold-item details > summary { list-style: none; cursor: pointer; padding: .55rem 0; font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: .4rem; user-select: none; }
.fold-item details > summary::-webkit-details-marker { display: none; }
.fold-item details > summary::after { content: "▾"; margin-left: auto; font-size: .6rem; color: var(--muted); }
.fold-item details[open] > summary::after { content: "▴"; }
.fold-item details > summary:hover { color: var(--text); }
.fold-item details[open] > summary { color: var(--text); }
.fold-preview { color: var(--dim); font-size: .78rem; }
.fold-body { padding: .5rem 0 .9rem; }
.fadv-quote { border-left: 2px solid #60a5fa44; padding-left: .7rem; color: var(--muted); font-size: .82rem; line-height: 1.7; margin-bottom: .5rem; }
.fadv-tbl { font-size: .78rem; width: 100%; border-collapse: collapse; }
.fadv-tbl td { padding: .15rem .5rem .15rem 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.fadv-tbl td:last-child { color: #aaa; }
.fev-row { display: grid; grid-template-columns: 60px 76px 1fr; gap: .3rem; padding: .3rem 0; border-bottom: 1px solid var(--line); font-size: .78rem; }
.fev-row:last-child { border-bottom: none; }
.fev-t { color: var(--dim); }
.fev-type { font-weight: 600; }
.fev-d { color: var(--muted); }
.fhist-tbl { font-size: .75rem; width: 100%; border-collapse: collapse; }
.fhist-tbl th { color: var(--muted); font-weight: 600; padding: .2rem .3rem .3rem; border-bottom: 1px solid var(--border); text-align: right; }
.fhist-tbl th:first-child { text-align: left; }
.fhist-tbl td { padding: .2rem .3rem; text-align: right; color: var(--muted); border-bottom: 1px solid var(--line); }
.fhist-tbl td:first-child { text-align: left; color: var(--dim); }
.flift-row { display: flex; justify-content: space-between; align-items: center; padding: .3rem .5rem; background: var(--surface); border-radius: 4px; margin-bottom: .22rem; font-size: .82rem; }
.flift-k { color: var(--muted); font-size: .72rem; }
.flift-v { color: var(--text); font-weight: 600; }
.flift-m { font-size: .75rem; font-weight: 700; }
.flift-m-p { color: var(--green); }
.flift-m-n { color: var(--red); }
.fmuted { color: var(--muted); font-size: .78rem; }

#wrap { max-width: 1100px; margin: 0 auto; padding: 0; }
</style>
{% endblock %}

{% block content %}
<div id="d-content"
     hx-get="/dash/partial"
     hx-trigger="every 30s"
     hx-swap="innerHTML">
  {% include "dash/dash_partial.html" %}
</div>
{% endblock %}
