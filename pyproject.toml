[project]
name = "auto-content-engine"
version = "0.2.0"
description = "Self-evolving content generation system inspired by autoresearch"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "NoteClient2>=1.0.5",
    "Pillow>=10.0.0",
    "requests>=2.32.0",
    "requests-oauthlib>=2.0.0",
    "matplotlib>=3.8.0",
    "playwright>=1.40.0",
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
sd = ["diffusers>=0.30.0", "transformers>=4.40.0", "accelerate>=0.30.0", "torch>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
