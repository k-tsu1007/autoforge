<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SNS Service{% endblock %}</title>
<style>
:root {
  --bg: #0a0a0a; --surface: #111111; --surface2: #161616; --border: #222222;
  --text: #f0f0f0; --muted: #888888; --dim: #555555;
  --green: #4ade80; --blue: #60a5fa; --yellow: #facc15; --red: #f87171;
  --font-mono: "SF Mono","Fira Code","Consolas",monospace;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.hdr { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); height: 48px; display: flex; align-items: center; padding: 0 1.2rem; gap: 1.5rem; }
.hdr-logo { font-weight: 700; font-size: .9rem; }
.hdr-logo span { color: var(--blue); }
.hdr-nav { display: flex; gap: .2rem; }
.hdr-nav a { padding: .35rem .75rem; border-radius: 6px; font-size: .8rem; color: var(--muted); transition: all .15s; }
.hdr-nav a:hover { background: var(--surface2); color: var(--text); text-decoration: none; }
.hdr-nav a.active { background: var(--surface2); color: var(--text); font-weight: 600; }
.main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.2rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
.btn { display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .8rem; border-radius: 6px; border: 1px solid var(--border); font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; background: var(--surface2); color: var(--muted); }
.btn:hover { border-color: var(--muted); color: var(--text); }
.btn-primary { border-color: var(--blue); color: #000; background: var(--blue); }
.btn-ng { border-color: #f8717133; color: var(--red); background: #1c0808; }
textarea, input[type="text"] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .6rem .8rem; font-family: var(--font-mono); font-size: .8rem; line-height: 1.6; resize: vertical; }
textarea:focus, input:focus { outline: none; border-color: var(--blue); }
.section-hd { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding-bottom: .4rem; margin-bottom: .8rem; border-bottom: 1px solid var(--border); }
.empty { text-align: center; padding: 2rem; color: var(--dim); font-size: .85rem; }
.post-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.post-table th, .post-table td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--border); }
.post-table th { background: var(--surface2); color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; }
.post-text { max-width: 400px; white-space: pre-wrap; word-break: break-word; color: var(--text); font-size: .8rem; }
.post-meta { color: var(--dim); font-family: var(--font-mono); font-size: .7rem; }
.badge-ok { background: #0c2016; color: var(--green); border: 1px solid #4ade8033; font-size: .68rem; padding: .1rem .4rem; border-radius: 999px; }
.badge-fail { background: #1c0808; color: var(--red); border: 1px solid #f8717133; font-size: .68rem; padding: .1rem .4rem; border-radius: 999px; }
{% block head %}{% endblock %}
</style>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo"><span>SNS</span> &middot; {{ instance }}</div>
  <nav class="hdr-nav">
    <a href="/" class="{% if active == 'home' %}active{% endif %}">Posts</a>
    <a href="/prompts" class="{% if active == 'prompts' %}active{% endif %}">Prompts</a>
    <a href="/generate" class="{% if active == 'generate' %}active{% endif %}">Post</a>
  </nav>
</header>
<main class="main">{% block content %}{% endblock %}</main>
</body>
</html>
