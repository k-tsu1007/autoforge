{% extends "base.html" %}
{% block title %}Post — SNS Service{% endblock %}
{% block head %}
<style>
.gen-input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .5rem .8rem; font-size: .82rem; }
.gen-field { margin-bottom: 1rem; }
.gen-label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .3rem; font-weight: 600; }
</style>
{% endblock %}
{% block content %}

<h2 style="margin-top:0;font-size:1.1rem;">Generate Post</h2>
<p style="color:var(--muted);font-size:.82rem;margin-bottom:1.2rem;">
  プロンプトのテスト実行。生成結果を確認・編集してから手動で投稿できます。自動投稿は Automation のスロットで行われます。
</p>

<form hx-post="/generate" hx-target="#pending-section" hx-swap="outerHTML">

  <div class="gen-field">
    <label class="gen-label">記事を選択 (記事連動)</label>
    <select class="gen-input" name="source_id">
      <option value="">— 記事なし (自由テキスト) —</option>
      {% for a in articles %}
      <option value="{{ a.note_id }}">{{ a.title[:60] }}</option>
      {% endfor %}
    </select>
  </div>

  {% if prompts %}
  <div class="gen-field">
    <label class="gen-label">Prompt</label>
    <select class="gen-input" name="prompt_name">
      {% for p in prompts %}
      <option value="{{ p.name }}" {% if p.name == 'article_promo' %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}

  <div class="gen-field">
    <label class="gen-label">自由テキスト (記事未選択の場合、これがそのまま下書きになる)</label>
    <textarea class="gen-input" name="custom_text" rows="4" placeholder="直接ツイートしたいテキスト..."></textarea>
  </div>

  <button type="submit" class="btn btn-primary" style="padding:.5rem 1.5rem;">Generate → Pending</button>
</form>

<div style="margin-top:1.5rem;">
{% include "_pending.html" %}
</div>

{% endblock %}
